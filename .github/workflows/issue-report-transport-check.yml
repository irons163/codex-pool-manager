name: Issue report transport checks

on:
  push:
    branches: ['**']
    paths:
      - 'CodexPoolManager/IssueReporting/**'
      - 'CodexPoolManager/Support/L10n.swift'
      - 'scripts/IssueReportTransportSmoke.swift'
      - 'scripts/test_issue_report_transport.sh'
      - '.github/workflows/issue-report-transport-check.yml'
  pull_request:
    paths:
      - 'CodexPoolManager/IssueReporting/**'
      - 'CodexPoolManager/Support/L10n.swift'
      - 'scripts/IssueReportTransportSmoke.swift'
      - 'scripts/test_issue_report_transport.sh'
      - '.github/workflows/issue-report-transport-check.yml'

permissions:
  contents: read

jobs:
  transport:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select release Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise real transport with Release optimization
        env:
          ISSUE_REPORT_SMOKE_OUTPUT: ${{ runner.temp }}/issue-report-transport-smoke
        run: bash scripts/test_issue_report_transport.sh
      - name: Show transport crash location
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = Path.home() / 'Library/Logs/DiagnosticReports'
          paths = sorted(reports.glob('issue-report-transport-smoke*.ips'), key=lambda path: path.stat().st_mtime)
          for path in paths[-2:]:
              _, body = path.read_text().split('\n', 1)
              report = json.loads(body)
              print('Transport exception:', report.get('exception'))
              for thread in report.get('threads', []):
                  if thread.get('triggered'):
                      for frame in thread.get('frames', [])[:18]:
                          print(frame.get('symbol', '<application frame>'), frame.get('imageOffset'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-report-transport-smoke
          path: ${{ runner.temp }}/issue-report-transport-smoke
          retention-days: 7
